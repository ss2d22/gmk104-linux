[package]
name = "pet-daemon"
version = "0.1.0"
edition = "2021"
description = "Digital pet daemon for GMK104 keyboard LCD"

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
shellexpand = "3"
