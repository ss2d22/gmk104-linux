[package]
name = "gmk104ctl"
version = "0.1.0"
edition = "2021"
description = "CLI utility for controlling GMK104 keyboard LCD display"
license = "MIT"

[dependencies]
hidapi = "2.6"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
image = "0.25"
indicatif = "0.17"
byteorder = "1.5"
chrono = "0.4"

[profile.release]
lto = true
strip = true
